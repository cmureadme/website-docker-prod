services:
    django:
        build: .
        expose:
            - "8000"
        volumes:
            - ./.env:/readme-website/.env
            - ./static:/readme-website/staticfiles
            - ./media:/readme-website/media
            - ./temp_uploads:/readme-website/temp_uploads
            - ./db.sqlite3:/readme-website/db.sqlite3
        restart: unless-stopped
    nginx:
        image: nginx:latest
        ports:
            - "8000:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./static:/static:ro
            - ./media:/media:ro
            - ./sample_dbs:/sample_dbs:ro
        depends_on:
            - django
    cleanup:
        build: .
        entrypoint: ["/cron-entrypoint.sh"]
        volumes:
            - ./.env:/readme-website/.env
            - ./temp_uploads:/readme-website/temp_uploads
            - ./db.sqlite3:/readme-website/db.sqlite3
            - ./logs:/readme-website/logs
        restart: unless-stopped